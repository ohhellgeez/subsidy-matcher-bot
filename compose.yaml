services:
  bot:
    build: .
    container_name: max_bot
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: max_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: max_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: